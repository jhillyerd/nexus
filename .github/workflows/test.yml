name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/gleam-lang/gleam:v1.19.0-erlang
    services:
      # Postgres service for schema apply, the squirrel drift gate, and the
      # live contract parity runner (nexus/store/verify, isolated temp schema).
      # The unit tests themselves stay offline: the store is a mockable
      # seam (src/nexus/store.gleam) and never touch this database.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      # On pull_request, test the head of the PR branch.
      REF: ${{ github.event.pull_request.head.sha || github.sha }}
      # The job container reaches the service container by name on the
      # compose network (in-network port 5432, not the host mapping).
      DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus
    steps:
      - name: Checkout
        # Manual clone: actions/checkout is a node action, and this image has no
        # node (the runner does not inject its node runtime into job containers).
        run: |
          # The GitHub runner bind-mounts the workspace owned by a different
          # UID than this container's user; git refuses to touch it otherwise
          # (Forgejo mounted it as the job user, so this never triggered there).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" fetch --quiet --depth 1 origin "$REF"
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach FETCH_HEAD
      - run: gleam deps download
      - name: Gleam warnings gate
        # Fails on ANY warning in this package (src and test). The flag is
        # root-package-scoped: dependency warnings (gramps/mist ship some)
        # are printed but do NOT fail the build, verified against a
        # from-clean compile.
        run: gleam build --warnings-as-errors
      - name: Apply schema
        run: gleam run -m nexus/store/migrate
      - name: Squirrel drift gate
        # Fails (exit 1) when src/nexus/store/sql.gleam is stale relative
        # to src/nexus/store/sql/*.sql.
        run: gleam run -m squirrel check
      - name: Store Postgres contract parity
        # Runs the shared nexus/store/contract suite against real Postgres 17
        # + nexus/store/persist in an isolated temporary schema.
        run: gleam run -m nexus/store/verify
      - run: gleam test
      - run: gleam format --check src test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://nexus:nexus@127.0.0.1:5432/nexus
      E2E_DATABASE_URL: postgres://nexus:nexus@127.0.0.1:5432/nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          gleam-version: "1.19.0"
      - name: Install system tools (psql, bwrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap postgresql-client
      - name: Install e2e Node dependencies
        run: npm --prefix e2e ci
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Playwright Chromium
        env:
          PW_CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$PW_CACHE_HIT" != "true" ]; then
            npm --prefix e2e exec -- playwright install --with-deps chromium
          else
            npm --prefix e2e exec -- playwright install-deps chromium
          fi
      - name: Download deps and build Gleam
        run: |
          gleam deps download
          gleam build
      - name: Apply schema
        run: gleam run -m nexus/store/migrate
      - name: Deterministic browser E2E suite
        run: node e2e/browser.spec.mjs
      - name: Deterministic node-protocol E2E suite
        run: node e2e/node.spec.mjs
      - name: Deterministic TUI E2E suite
        run: node e2e/tui.spec.mjs
      - name: Linux sandbox escape probes (bwrap)
        env:
          NEXUS_VERIFY_SANDBOX: bwrap
        run: gleam run -m nexus/env/verify
      - name: Upload E2E reports and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-diagnostics
          if-no-files-found: ignore
          path: |
            e2e/report.json
            e2e/node-report.json
            e2e/tui-report.json
            e2e/failure-*.png
